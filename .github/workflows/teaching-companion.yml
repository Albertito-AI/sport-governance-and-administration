name: Teaching companion checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check case links and editable downloads
        run: python3 -B scripts/check_companion.py
      - name: Test the venue and finance exercise
        run: python3 -B -m unittest discover -s lab -v
      - name: Run the published exercise with its supplied records
        run: python3 -B lab/reference_agent.py
